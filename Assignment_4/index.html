<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBTCOE's Login Page</title>
</head>
<body>
    <h1>Login Page</h1>

    <form>
        <label id="Username">
            Enter Your Username: 
            <input type="text" maxlength="20" minlength="8" placeholder="Enter Your Gmail.com ID" required style="width: 300px; height: 20px;">
        </label>
        <br><br>

        <label id="Password"> 
            Enter Your Password :
            <input type="password" maxlength="20" minlength="0" placeholder="Enter Your Password" required style="width: 300px; height: 20px;">
        </label>
        <br><br>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
